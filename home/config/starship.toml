"$schema" = 'https://starship.rs/config-schema.json'

palette = "duskfox"

[palettes.duskfox]
red = "#eb6f92"
green = "#a3be8c"
purple = "#c4a7e7"
yellow = "#f6c177"
os_bg = "#6e6a86"
os_fg = "#191726"
dir_bg = "#a3be8c"
dir_fg = "#232136"
git_bg = "#f6c177"
git_fg = "#2d2a45"
lang_bg = "#569fba"
lang_fg = "#373354"

[kubernetes]
disabled = false
detect_env_vars = ['KUBECONFIG']

[mise]
# runs `mise doctor` (~0.3 s) on every prompt; `mise doctor` by hand instead
disabled = true

# contexts named <cluster>-<stage> show only the stage, coloured by risk
[[kubernetes.contexts]]
context_pattern = ".+-(?P<stage>prod)$"
context_alias = "$stage"
style = "red"

[[kubernetes.contexts]]
context_pattern = ".+-(?P<stage>preprod)$"
context_alias = "$stage"
style = "yellow"

[[kubernetes.contexts]]
context_pattern = ".+-(?P<stage>dev)$"
context_alias = "$stage"
style = "green"

# AWS profile aliases are per customer: an environment's private repo renders
# this file plus its [aws.profile_aliases] into its root and points
# STARSHIP_CONFIG there (see the customer-a setup)
