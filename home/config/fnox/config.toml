# fnox global config, deployed to ~/.config/fnox/config.toml.
# Everything secret in this repo is stored here, age-encrypted to the key in
# ~/.config/fnox/age.txt (the Passwords entry "dotfiles age key").
# Run bootstrap through `mise run apply` (fnox exec) so templates can read them.
default_provider = "age"

[providers.age]
type = "age"
recipients = ["age1zf8cfg0hrzz6k3hfp3jeuttud8sak8hk5qdruhaw3m9alem93scqs2c0pj"]

[secrets]
GIT_EMAIL_GITLAB= { provider = "age", value = "" }
GIT_EMAIL_GITHUB= { provider = "age", value = "" }
GIT_EMAIL_HOMELAB= { provider = "age", value = "" }
INOVEX_GIT_EMAIL= { provider = "age", value = "" }
CUSTOMER_A_GIT_EMAIL= { provider = "age", value = "" }
INOVEX_GITLAB_HOST= { provider = "age", value = "" }
CUSTOMER_A_GITLAB_HOST= { provider = "age", value = "" }
CUSTOMER_A_GITLAB_USER= { provider = "age", value = "" }
CUSTOMER_A_SSH_KEY= { provider = "age", value = "" }
CUSTOMER_A_NONO_PROFILE_WORK= { provider = "age", value = "" }
CUSTOMER_A_NONO_PROFILE_CORE= { provider = "age", value = "" }
CUSTOMER_A_HOST_BACKSTAGE= { provider = "age", value = "" }
CUSTOMER_A_HOST_MONITORING_MCP= { provider = "age", value = "" }
CUSTOMER_A_SELF_APPROVAL_GROUP= { provider = "age", value = "" }
CUSTOMER_A_SELF_APPROVAL_EXCLUDED= { provider = "age", value = "" }

[files]
"~/.ssh/config"= { provider = "age", value = "" }
"~/.ssh/id_ed25519"= { provider = "age", value = "" }
