macos:
  defaults:
    # Mission Control: don't rearrange spaces based on most recent use
    - domain: com.apple.dock
      key: mru-spaces
      type: bool
      value: false
      restart: Dock
    # auto-hide the menu bar, sketchybar takes its place
    - domain: NSGlobalDomain
      key: _HIDE_MENU_BAR
      type: bool
      value: true
