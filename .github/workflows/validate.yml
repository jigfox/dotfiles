name: validate

# the check Renovate waits for before it automerges
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  renovate-config:
    name: renovate config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: npx --yes --package renovate renovate-config-validator --strict

  chezmoi-externals:
    name: chezmoi external checksums
    runs-on: ubuntu-latest
    permissions:
      # push the new checksums to Renovate's branch
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref || github.ref }}
      - name: fix checksums on Renovate branches
        if: startsWith(github.head_ref, 'renovate/')
        run: |
          python3 .github/scripts/chezmoi-external-checksums.py --fix
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -am "chore(deps): update chezmoi external checksums"
            git push
          fi
      - run: python3 .github/scripts/chezmoi-external-checksums.py
