# Environment "customer-a": work for a customer. The repo is public, so the
# customer's files live in a private repo, cloned to
# ~/.local/share/dotfiles-customer-a (URL: fnox secret CUSTOMER_A_REPO) and
# linked into place by its own `setup` script. Only the files shared with the
# other environments (git, lazygit, nono base profile) are templated here, with
# the CUSTOMER_A_* fnox secrets. To add a customer see README, "Adding a customer".
# Select it in ~/.config/mise/miserc.local.toml: env = ["customer-a", ...], or
# under a local alias: env = ["acme"] and [env_sets] acme = ["customer-a"].

[bootstrap.secrets]
CUSTOMER_A_GIT_EMAIL = "CUSTOMER_A_GIT_EMAIL"
CUSTOMER_A_GITLAB_HOST = "CUSTOMER_A_GITLAB_HOST"

# the URL is a secret too; env, because repos can't read secret() (so the first,
# secret-less pass runs with --skip repos)
[bootstrap.repos]
"~/.local/share/dotfiles-customer-a" = { url = "{{ env.CUSTOMER_A_REPO }}" }

[bootstrap.packages]
"brew:openconnect" = "latest"

# work mise.toml, nono work profiles, ssh key: links into the private repo
[bootstrap.hooks]
post-dotfiles = "~/.local/share/dotfiles-customer-a/setup"

[dotfiles]
# git identity
"~/.config/git/env-customer-a.inc" = { source = "../templates/git/env-customer-a.inc.tera", mode = "template" }
"~/.config/git/customer-a.gitconfig" = { source = "../templates/git/customer-a.gitconfig.tera", mode = "template" }
"~/.config/nvim-copilot-dirs" = { source = "../templates/nvim-copilot-dirs.tera", mode = "template" }

# read-only Kubernetes MCP server of the work sandbox (nothing customer-specific)
"~/.config/work/kubernetes-mcp.toml" = { source = "../home/config/work/kubernetes-mcp.toml" }

# Zen profile "customer" (accent #f6c177)
"~/Library/Application Support/zen/Profiles/customer/user.js" = { source = "../home/zen/user.js", variants = [{ os = "macos" }] }
"~/Library/Application Support/zen/Profiles/customer/chrome/userChrome.css" = { source = "../home/zen/userChrome.css", variants = [{ os = "macos" }] }
"~/Library/Application Support/zen/Profiles/customer/chrome/userContent.css" = { source = "../home/zen/userContent.css", variants = [{ os = "macos" }] }
"~/Library/Application Support/zen/Profiles/customer/chrome/accent.css" = { source = "../home/zen/accent-customer.css", variants = [{ os = "macos" }] }
