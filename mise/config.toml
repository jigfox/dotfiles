# Global mise config of every machine (~/.config/mise is a link to this
# directory, see README). It is the base; the environments listed in
# ~/.config/mise/miserc.local.toml (personal, inovex, customer-a, ...) add their
# files config.<env>.toml on top.
#
# Sources of [dotfiles] are relative to this directory (hence the ../).
# Secrets come from fnox (home/config/fnox/config.toml): run `mise run apply`.

[settings]
experimental = true

[settings.dotfiles]
# links relative to their location, so they do not depend on where mise runs
relative_symlinks = true

[settings.age]
# decrypts the encrypted tracked files; the same key as fnox's
key_file = "~/.config/fnox/age.txt"

[tools]
node = "lts"
java = "zulu"
# CLI tools with prebuilt binaries; Homebrew only keeps what bootstrap needs
# before its tools step, what GUI apps call, and what mise can't install
delta = "0.21.1"
difftastic = "0.72.0"
fd = "10.5.2"
fzf = "0.75.0"
herdr = "0.9.5"
jq = "1.8.2"
# kubectl finds the plugin only as kubectl-krew
"github:kubernetes-sigs/krew" = { version = "0.5.0", bin = "kubectl-krew" }
lazygit = "0.66.3"
neovim = "0.12.6"
ripgrep = "15.2.0"
sops = "3.13.3"
starship = "1.27.0"
yq = "4.54.3"
zoxide = "0.10.0"

[env]
MISE_EXPERIMENTAL = "1"

# [prepare.npm]
# auto = true
#
# [prepare.pnpm]
# auto = true
#
# [prepare.yarn]
# auto = true
#
# [prepare.go]
# auto = true

# --- secrets (names in fnox) ---------------------------------------------------

[bootstrap.secrets]
GIT_EMAIL_GITLAB = "GIT_EMAIL_GITLAB"
GIT_EMAIL_GITHUB = "GIT_EMAIL_GITHUB"
GIT_EMAIL_HOMELAB = "GIT_EMAIL_HOMELAB"

# --- packages -----------------------------------------------------------------

[bootstrap.packages]
# needed before the tools step: age and fnox by the hooks and the `fnox exec`
# around bootstrap, mas by the mas: packages below
"brew:age" = "latest"
"brew:fnox" = "latest"
"brew:mas" = "latest"
# mise itself, so `mise bootstrap packages prune` keeps it
"brew:mise" = "latest"
# login shell, needs a stable path in /etc/shells
"brew:fish" = "latest"
# git and git-lfs are also called by GUI apps, which don't see mise's PATH
"brew:git" = "latest"
"brew:git-lfs" = "latest"
# no macOS binaries for mise
"brew:eza" = "latest"
"brew:moreutils" = "latest"
"brew:sshpass" = "latest"
"brew:switchaudio-osx" = "latest"
# App Store apps install only if this Apple ID has downloaded them before
"mas:1643649331" = "latest" # OpenIn
"mas:1451685025" = "latest" # WireGuard
"brew-cask:kitty" = "latest"
"brew-cask:zen" = "latest"
"brew-cask:font-hack-nerd-font" = "latest"
"brew-cask:font-symbols-only-nerd-font" = "latest"
# aerospace (cask of the tap nikitabobko/tap) is installed by the post-packages hook:
# mise needs Ruby 3 to read a tap cask that has no published metadata
"brew:felixkratz/formulae/sketchybar" = "latest"

# --- repositories -------------------------------------------------------------

[bootstrap.repos]
# cloned over https, the pushurl is set in the post-repos hook
"~/.config/nvim" = { url = "https://github.com/jigfox/neovim.git" }

# --- macOS --------------------------------------------------------------------

# auto-hide the Dock (sketchybar and aerospace replace it); Mission Control:
# don't rearrange spaces based on most recent use
[bootstrap.settings.macos.dock]
autohide = true
mru_spaces = false

# auto-hide the menu bar, sketchybar takes its place
[bootstrap.settings.macos.defaults.NSGlobalDomain]
_HIDE_MENU_BAR = true

# Zen enterprise policies (read from its defaults domain), apply to all profiles:
# install these extensions from addons.mozilla.org, they stay updated by Zen.
# The whole ExtensionSettings dict is written, so list every extension.
[bootstrap.settings.macos.defaults."app.zen-browser.zen"]
EnterprisePoliciesEnabled = true

# vim keybindings
[bootstrap.settings.macos.defaults."app.zen-browser.zen".ExtensionSettings."tridactyl.vim@cmcaine.co.uk"]
installation_mode = "normal_installed"
install_url = "https://addons.mozilla.org/firefox/downloads/latest/tridactyl-vim/latest.xpi"

# iCloud Passwords
[bootstrap.settings.macos.defaults."app.zen-browser.zen".ExtensionSettings."password-manager-firefox-extension@apple.com"]
installation_mode = "normal_installed"
install_url = "https://addons.mozilla.org/firefox/downloads/latest/icloud-passwords/latest.xpi"

# ad and tracker blocker
[bootstrap.settings.macos.defaults."app.zen-browser.zen".ExtensionSettings."uBlock0@raymondhill.net"]
installation_mode = "normal_installed"
install_url = "https://addons.mozilla.org/firefox/downloads/latest/ublock-origin/latest.xpi"

# --- shell --------------------------------------------------------------------

[bootstrap.user]
login_shell = "fish"

# Not [bootstrap.mise_shell_activate] fish = "auto": mise refuses to edit
# config.fish because it is a link into home/config/fish. The same activation
# (prompt: activate, scripts: shims) is home/config/fish/conf.d/10-mise.fish.

# --- tracked files history ----------------------------------------------------

# Files with mode = "track" are saved to a local git history on every change
# (the watcher service) and synced with this private repo, never with this
# public one. Encrypted entries use the fnox age key (settings.age.key_file).
[history.origin]
url = "git@github.com:jigfox/dotfiles-history.git"

[history.encryption]
recipients = ["age1zf8cfg0hrzz6k3hfp3jeuttud8sak8hk5qdruhaw3m9alem93scqs2c0pj"]

[bootstrap.services.mise-history]
builtin = "history-watch"

# --- hooks and bootstrap task -------------------------------------------------

# Hooks and the task run on every `mise bootstrap`; the scripts (mise/scripts)
# do nothing when their inputs are unchanged, state in ~/.local/state/dotfiles.
[bootstrap.hooks]
pre-packages = [
  "~/.config/mise/scripts/check-age-key",
  "~/.config/mise/scripts/install-brew",
  "~/.config/mise/scripts/link-fnox-config",
]
post-packages = "~/.config/mise/scripts/install-tap-casks"
# ssh key and GitHub's host key before private repos are cloned over ssh
pre-repos = "~/.config/mise/scripts/prepare-ssh"
post-repos = "~/.config/mise/scripts/set-nvim-pushurl"
post-dotfiles = "~/.config/mise/scripts/zen-profiles {% if mise_env is defined %}{{ mise_env | join(sep=' ') }}{% endif %}"
post-defaults = "killall Dock || true"
# IDEs look for JDKs where asdf kept them; the link needs mise's java, hence after the tools
post-tools = "mkdir -p ~/.asdf/installs && ln -sfn ~/.local/share/mise/installs/java ~/.asdf/installs/java"

[tasks.bootstrap]
description = "Downloads, fonts and fish plugins, the steps bootstrap has no section for"
run = [
  "~/.config/mise/scripts/fetch-externals",
  "~/.config/mise/scripts/install-fonts",
  "~/.config/mise/scripts/fisher-update",
]

# --- dotfiles -----------------------------------------------------------------

[dotfiles]
# fnox itself (home/config/fnox/config.toml) is linked by the link-fnox-config hook
"~/.ssh" = { permissions = "0700" }
"~/.ssh/config" = { mode = "fnox", permissions = "0600" }
"~/.ssh/id_ed25519" = { mode = "fnox", permissions = "0600" }
"~/.ssh/id_ed25519.pub" = { source = "../home/ssh/id_ed25519.pub" }

# git: ~/.gitconfig includes the identities of the environments
"~/.gitconfig" = { source = "../templates/gitconfig.tera", mode = "template" }
"~/.config/git/attributes" = { source = "../home/config/git/attributes" }
"~/.config/git/ignore" = { source = "../home/config/git/ignore" }
"~/.config/git/gitlab.gitconfig" = { source = "../templates/git/gitlab.gitconfig.tera", mode = "template" }
"~/.config/git/github.gitconfig" = { source = "../templates/git/github.gitconfig.tera", mode = "template" }
"~/.config/git/homelab.gitconfig" = { source = "../templates/git/homelab.gitconfig.tera", mode = "template" }

# symlink-each: the programs also write into these directories (fisher, kitty,
# herdr, ...), only the files of this repo are links
"~/.config/fish" = { source = "../home/config/fish", mode = "symlink-each" }
"~/.config/ghostty" = { source = "../home/config/ghostty", mode = "symlink-each" }
"~/.config/herdr" = { source = "../home/config/herdr", mode = "symlink-each" }
"~/.config/kitty" = { source = "../home/config/kitty", mode = "symlink-each" }
"~/.config/pnpm" = { source = "../home/config/pnpm", mode = "symlink-each" }
"~/.config/tridactyl" = { source = "../home/config/tridactyl", mode = "symlink-each" }
"~/.config/starship.toml" = { source = "../home/config/starship.toml" }
"~/.config/lazygit/config.yml" = { source = "../templates/lazygit.yml.tera", mode = "template" }

# nono rewrites its profiles, which replaced links with real files: they are
# tracked in place and autosaved to the history origin (see [history] below).
# Encrypted, because profiles name credentials (the history push refuses
# plaintext that looks like a secret). Track entries are only read from this
# global file, so the customer's are variants of its environment.
"~/.config/nono/profiles/n.json" = { mode = "track", encrypt = true }
"~/.config/nono/profiles/opencode.json" = { mode = "track", encrypt = true }
"~/.config/nono/profiles/opencode-ant.json" = { mode = "track", encrypt = true }
"~/.config/nono/profiles/agent-claude-core.json" = { mode = "track", encrypt = true }
"~/.config/nono/profiles/github.json" = { mode = "track", encrypt = true }
"~/.config/nono/work/work.json" = { mode = "track", encrypt = true, variants = [{ profile = "customer-a" }] }
"~/.config/nono/profiles/base.json" = { source = "../templates/nono/base.json.tera", mode = "template" }

# sandboxed agent roots (README, "Sandboxed agents"): the generic root config,
# the wrappers that run claude, codex and opencode in nono, and ~/src/github.com
"~/.config/work/mise.toml" = { source = "../home/config/work/mise.toml" }
"~/.config/work/bin/claude" = { source = "scripts/agent" }
"~/.config/work/bin/codex" = { source = "scripts/agent" }
"~/.config/work/bin/opencode" = { source = "scripts/agent" }

"~/.default-npm-packages" = { source = "../home/default-npm-packages" }
"~/.editorconfig" = { source = "../home/editorconfig" }

# macOS only
"~/.config/aerospace" = { source = "../home/config/aerospace", mode = "symlink-each", variants = [{ os = "macos" }] }
"~/.config/sketchybar" = { source = "../home/config/sketchybar", mode = "symlink-each", variants = [{ os = "macos" }] }
"~/Library/Application Support/Mozilla/NativeMessagingHosts/tridactyl.json" = { source = "../templates/tridactyl-native.json.tera", mode = "template", variants = [{ os = "macos" }] }
